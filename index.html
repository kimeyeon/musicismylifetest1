<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상황별 음악 추천 - 듣다</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <!-- Login Modal (Temporarily Hidden) -->
    <div id="login-modal" class="login-modal hidden">
        <div class="login-content">
            <h2>VIBE<span class="highlight">MATCH</span></h2>
            <p>학번과 이름으로 간편하게 시작해요!</p>
            <form id="login-form">
                <input type="text" id="login-student-id" placeholder="학번 (예: 20241111)" required />
                <input type="text" id="login-name" placeholder="이름 (예: 김예현)" required />
                <button type="submit" class="btn-login">입장하기</button>
            </form>
        </div>
    </div>

    <!-- Removed Welcome Animation -->

    <!-- Main Content -->
    <div id="app-content" class="app-content hidden">
        <!-- Removed Marquee Banner -->

        <!-- Header & Search -->
        <header class="main-header">
            <div class="header-top">
                <h2 class="logo">VIBE<span class="highlight">MATCH</span></h2>
                <button class="btn-share" id="btn-share-main" aria-label="플레이리스트 공유하기">
                    <i class="ph ph-share-network"></i> 나만의 플리 공유하기
                </button>
            </div>
            <div class="search-container">
                <i class="ph ph-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" placeholder="어떤 노래나 아티스트를 찾고 있나요? 다 찾아드릴게요!" />
            </div>
        </header>

        <!-- Music Feed Sections (Main Page) -->
        <main class="music-feed" id="music-feed-container">
            <!-- Sections will be injected by JS -->
        </main>

        <!-- Sub Page (Detail View) -->
        <main class="sub-page hidden" id="sub-page-container">
            <div class="sub-page-header">
                <button id="btn-back-main" class="btn-back"><i class="ph-bold ph-arrow-left"></i> 뒤로가기</button>
                <h2 id="sub-page-title">타이틀</h2>
            </div>
            
            <nav class="sub-category-nav" id="sub-category-nav">
                <!-- Sub tabs injected by JS -->
            </nav>

            <div class="music-grid" id="sub-music-grid">
                <!-- Cards injected by JS -->
            </div>
        </main>
            <!-- Real-time Board Section (Temporarily Hidden) -->
            <section class="realtime-board hidden">
                <div class="board-header">
                    <h3>🔥 실시간 음악 추천 게시판</h3>
                    <button id="btn-write-board" class="btn-small">추천 글 남기기</button>
                </div>
                <!-- Write Form (Hidden by default) -->
                <div id="board-write-form" class="board-write-form hidden">
                    <input type="text" id="board-music-title" placeholder="추천할 음악 제목과 아티스트" />
                    <input type="text" id="board-content" placeholder="어떤 상황에 추천하나요? 이유를 적어주세요!" />
                    <button id="btn-submit-board" class="btn-submit">등록하기</button>
                </div>
                <div class="board-list" id="board-list">
                    <!-- Board items injected by JS -->
                </div>
            </section>


    </div>

    <!-- Global Player -->
    <div class="global-player hidden" id="global-player">
        <div class="player-info">
            <img src="" alt="현재 재생중인 앨범 아트" id="player-thumb" class="player-thumb">
            <div class="player-text">
                <h4 id="player-title">재생 중인 곡 없음</h4>
                <p id="player-artist">-</p>
            </div>
        </div>
        <div class="player-controls">
            <button class="btn-control" id="btn-prev" aria-label="이전 곡"><i class="ph-fill ph-skip-back"></i></button>
            <button class="btn-control play-pause" id="btn-play-pause" aria-label="재생/일시정지"><i class="ph-fill ph-play-circle"></i></button>
            <button class="btn-control" id="btn-next" aria-label="다음 곡"><i class="ph-fill ph-skip-forward"></i></button>
        </div>
        <div class="player-notice">
            <span>광고 없는 청취를 위해 30초 미리듣기를 제공해요! 🎵</span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <!-- YouTube Iframe API Container (Invisible) -->
        <div id="yt-player-container" style="position: absolute; width: 200px; height: 200px; top: -9999px; left: -9999px; opacity: 0.01; pointer-events: none;">
            <div id="youtube-player"></div>
        </div>
    </div>

    <!-- AI Chatbot -->
    <div class="chatbot-container">
        <button class="chatbot-fab" id="chatbot-fab" aria-label="AI 음악 추천 챗봇 열기">
            <i class="ph-fill ph-robot"></i>
        </button>
        <div class="chatbot-window hidden" id="chatbot-window">
            <div class="chat-header">
                <h4>VIBE AI <span>온라인</span></h4>
                <button class="btn-close-chat" id="btn-close-chat"><i class="ph ph-x"></i></button>
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="message ai-message">
                    <div class="msg-bubble">안녕하세요! 오늘 하루는 어떠셨나요? 상황을 말해주시면 찰떡같은 음악을 골라드릴게요. 😊</div>
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="예: 나 오늘 과제 다 날려 먹어서 진짜 우울해..." />
                <button id="btn-send-chat" aria-label="메시지 전송"><i class="ph-fill ph-paper-plane-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-notification" id="toast-notification">
        클립보드에 복사되었어요!
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js"></script>
</body>
</html>
